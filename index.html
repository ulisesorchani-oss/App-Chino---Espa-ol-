<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Chino-Español | Minería de Oraciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>0️⁃️ Chino-Español</h1>
            <p class="subtitle">Aprende con contexto, paso a paso</p>
        </header>

        <!-- Panel de Control -->
        <div class="control-panel">
            <div class="mode-selector">
                <button id="btn-es-cn" class="mode-btn active">🇪🇸→🇨🇳 Aprendo Chino</button>
                <button id="btn-cn-es" class="mode-btn">🇨🇳→🇪🇸 Aprendo Español</button>
            </div>
            <div class="script-toggle">
                <button id="btn-simplified" class="script-btn active">简 简体</button>
                <button id="btn-traditional" class="script-btn">繁 繁體</button>
            </div>
            
            <div class="stats">
                <span id="stats-known">✅ Conocidas: 0</span>
                <span id="stats-new">🎖️ Nuevas: 0</span>
            </div>
        </div>

        <!-- Filtro por Categoría -->
        <div class="category-filter">
            <button class="cat-btn active" data-module="todas">Todas</button>
            <button class="cat-btn" data-module="Saludos">Saludos</button>
            <button class="cat-btn" data-module="Migraciones">Migraciones</button>
            <button class="cat-btn" data-module="Supermercado">Supermercado</button>
            <button id="btn-reset" class="btn-reset">Borrar progreso</button>
        </div>

        <!-- Tarjeta de Oración -->
        <div class="card" id="sentence-card">
            <div class="card-header">
                <span class="card-level" id="card-level">Nivel 1</span>
                <span class="card-number" id="card-number">1/10</span>
            </div>
            
            <div class="sentence-container">
                <p class="sentence" id="sentence-text"></p>
                <p class="translation" id="translation-text"></p>
            </div>

            <!-- Input para respuesta -->
            <div class="answer-section" id="answer-section">
                <input type="text" id="answer-input" placeholder="Escribe la palabra faltante...">
                <button id="btn-check" class="btn-primary">Verificar</button>
            </div>

            <!-- Feedback -->
            <div class="feedback hidden" id="feedback">
                <p id="feedback-text"></p>
            </div>

            <!-- Botones de navegación -->
            <div class="card-actions">
                <button id="btn-reveal" class="btn-secondary">👁️ Revelar</button>
                <button id="btn-know" class="btn-success">✅ La sé</button>
                <button id="btn-not-know" class="btn-warning">🔄 Repetir</button>
            </div>
        </div>

        <!-- Panel de Vocabulario -->
        <div class="vocabulary-panel">
            <h3>📚 Palabras aprendidas</h3>
            <p class="vocab-hint">Se guardan automáticamente al cerrar el navegador</p>
            <div id="vocab-list"></div>
        </div>

        <!-- Controles de Audio -->
        <div class="audio-controls">
            <button id="btn-play-es" class="btn-audio">🔊 Español</button>
            <button id="btn-play-cn" class="btn-audio">🔊 Chino</button>
            <span id="script-label" class="script-label">简体</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
